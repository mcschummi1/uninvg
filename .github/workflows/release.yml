name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: chmod +x gradlew
      - name: Derive version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((MAJOR * 1000000 + MINOR * 10000 + PATCH * 100))" >> "$GITHUB_ENV"
      - run: ./gradlew -PappVersionName="$VERSION_NAME" -PappVersionCode="$VERSION_CODE" testDebugUnitTest lintDebug assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk "UniNVG-${GITHUB_REF_NAME}.apk"
      - run: gh release create "$GITHUB_REF_NAME" "UniNVG-${GITHUB_REF_NAME}.apk" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
