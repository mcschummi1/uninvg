name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: chmod +x gradlew
      - name: Derive version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((MAJOR * 1000000 + MINOR * 10000 + PATCH * 100))" >> "$GITHUB_ENV"
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.UNINVG_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.UNINVG_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.UNINVG_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.UNINVG_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing key configured; falling back to default debug signing"
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/uninvg-release.keystore"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          {
            echo "SIGNING_KEYSTORE_FILE=$KEYSTORE_PATH"
            echo "SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD"
            echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS"
            echo "SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - run: ./gradlew -PappVersionName="$VERSION_NAME" -PappVersionCode="$VERSION_CODE" testDebugUnitTest lintDebug assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk "UniNVG-${GITHUB_REF_NAME}.apk"
      - run: gh release create "$GITHUB_REF_NAME" "UniNVG-${GITHUB_REF_NAME}.apk" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
