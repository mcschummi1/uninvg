name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Cache Robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-all-v1
          restore-keys: robolectric-android-all-
      - name: Restore signing key from cache
        id: keycache
        uses: actions/cache@v4
        with:
          path: keystore
          key: uninvg-signing-v1
      - run: chmod +x gradlew
      - name: Derive version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH BUILD <<< "$VERSION"
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 + BUILD))" >> "$GITHUB_ENV"
      - name: Resolve signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.UNINVG_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.UNINVG_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.UNINVG_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.UNINVG_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          KEYSTORE=""
          KEY_PASS=""
          KEY_ALIAS="uninvg"
          KEY_PASS_KEY=""

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Using signing key from repository secrets"
            KEYSTORE="$RUNNER_TEMP/uninvg-release.keystore"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            KEY_PASS="$SECRET_STORE_PASSWORD"
            KEY_ALIAS="${SECRET_KEY_ALIAS:-uninvg}"
            KEY_PASS_KEY="${SECRET_KEY_PASSWORD:-$KEY_PASS}"
          else
            mkdir -p keystore
            if [ -f keystore/uninvg-release.keystore ] && [ -f keystore/uninvg-signing.properties ]; then
              echo "Using signing key from actions cache"
              KEYSTORE="$PWD/keystore/uninvg-release.keystore"
            else
              echo "Signing key not in cache; restoring from internal draft-release vault"
              REL_JSON=$(gh api "repos/$REPO/releases?per_page=100")
              RID=$(printf '%s' "$REL_JSON" | jq -r '[.[] | select(.draft and .tag_name == "uninvg-signing-key")][0].id // empty')
              if [ -n "$RID" ]; then
                for NAME in uninvg-release.keystore uninvg-signing.properties; do
                  AID=$(printf '%s' "$REL_JSON" | jq -r --arg n "$NAME" '[.[] | select(.draft and .tag_name == "uninvg-signing-key")][0].assets[] | select(.name == $n) | .id // empty')
                  if [ -n "$AID" ]; then
                    gh api "repos/$REPO/releases/assets/$AID" -H "Accept: application/octet-stream" > "keystore/$NAME"
                  fi
                done
              fi
            fi
            if [ -f keystore/uninvg-release.keystore ] && [ -f keystore/uninvg-signing.properties ]; then
              KEYSTORE="$PWD/keystore/uninvg-release.keystore"
            else
              echo "No signing key found; generating a new permanent release key (one time only)"
              KEY_PASS="$(openssl rand -hex 24)"
              echo "::add-mask::$KEY_PASS"
              printf 'KEY_PASS=%s\n' "$KEY_PASS" > keystore/uninvg-signing.properties
              keytool -genkeypair -v \
                -keystore keystore/uninvg-release.keystore \
                -storetype PKCS12 \
                -alias uninvg \
                -keyalg RSA -keysize 2048 -validity 10950 \
                -storepass "$KEY_PASS" -keypass "$KEY_PASS" \
                -dname "CN=UniNVG, OU=UniNVG, O=uninvg, C=US"
              echo "Saving signing key to the internal draft-release vault"
              RID=$(printf '%s' "$(gh api "repos/$REPO/releases?per_page=100")" | jq -r '[.[] | select(.draft and .tag_name == "uninvg-signing-key")][0].id // empty')
              if [ -z "$RID" ]; then
                gh api --method POST "repos/$REPO/releases" \
                  -f tag_name="uninvg-signing-key" \
                  -f name="UniNVG signing key (internal, do not publish)" \
                  -F draft=true \
                  -f body="Vault holding the app signing key. Keep as draft." > /dev/null
              fi
              RID=$(printf '%s' "$(gh api "repos/$REPO/releases?per_page=100")" | jq -r '[.[] | select(.draft and .tag_name == "uninvg-signing-key")][0].id')
              upload_asset() {
                NAME="$1"
                FILE="$2"
                OLD_ASSET=$(gh api "repos/$REPO/releases/$RID/assets?per_page=100" | jq -r --arg n "$NAME" '.[] | select(.name == $n) | .id // empty')
                if [ -n "$OLD_ASSET" ]; then
                  gh api --method DELETE "repos/$REPO/releases/assets/$OLD_ASSET" > /dev/null
                fi
                gh api --method POST "https://uploads.github.com/repos/$REPO/releases/$RID/assets?name=$NAME" \
                  -H "Content-Type: application/octet-stream" --input "$FILE" > /dev/null
              }
              upload_asset uninvg-release.keystore keystore/uninvg-release.keystore
              upload_asset uninvg-signing.properties keystore/uninvg-signing.properties
            fi
            KEY_PASS=$(sed -n 's/^KEY_PASS=//p' keystore/uninvg-signing.properties)
            KEY_PASS_KEY="$KEY_PASS"
          fi

          keytool -list -keystore "$KEYSTORE" -storepass "$KEY_PASS" -alias "$KEY_ALIAS" > /dev/null
          FINGERPRINT=$(keytool -list -v -keystore "$KEYSTORE" -storepass "$KEY_PASS" -alias "$KEY_ALIAS" | grep 'SHA256:' | head -n 1 | sed 's/^ *//')
          {
            echo "SIGNING_KEYSTORE_FILE=$KEYSTORE"
            echo "SIGNING_STORE_PASSWORD=$KEY_PASS"
            echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
            echo "SIGNING_KEY_PASSWORD=$KEY_PASS_KEY"
          } >> "$GITHUB_ENV"
          echo "### Release signing" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$FINGERPRINT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Every release signed with this certificate updates in place over the previous one."
      - name: Show signing state
        run: |
          if [ -n "${SIGNING_KEYSTORE_FILE:-}" ]; then
            echo "Releases will be signed with the stable UniNVG key"
          else
            echo "No signing key resolved; falling back to ephemeral debug signing"
          fi
      - run: ./gradlew -PappVersionName="$VERSION_NAME" -PappVersionCode="$VERSION_CODE" testDebugUnitTest lintDebug assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk "UniNVG-${GITHUB_REF_NAME}.apk"
      - run: gh release create "$GITHUB_REF_NAME" "UniNVG-${GITHUB_REF_NAME}.apk" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
